      /* Suppress LastPass and all password manager overlays */
      [data-lastpass-icon-root], [data-lastpass-root], [data-lastpass-infield],
      [id*="lastpass"], [class*="lastpass"], [id*="LastPass"], [class*="LastPass"],
      .lp-icon, div[data-lp-id], [data-lp-id],
      [id*="__lpform_"], [id*="__lp_"], [id*="lp-"], span.__lpignore,
      div[style*="lastpass"], iframe[src*="lastpass"],
      [data-dashlane-rid], [data-dashlane-label],
      [data-1p-ignore], [data-bwi-id],
      div[id^="kw-"], div[class^="kw-"] { display: none !important; }

      input::-webkit-credentials-auto-fill-button,
      input::-webkit-contacts-auto-fill-button,
      input::-webkit-strong-password-auto-fill-button { display: none !important; visibility: hidden !important; }
    </style>
